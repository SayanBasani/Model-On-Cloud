<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ModelOnCloud - AI Chat</title>

    <meta
        name="description"
        content="Chat with ModelOnCloud AI using a simple API."
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f7fb;
            color: #111827;
            min-height: 100vh;
        }

        .navbar {
            height: 64px;
            border-bottom: 1px solid #e5e7eb;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #111827;
        }

        .logo span {
            color: #6366f1;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            color: #16a34a;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
        }

        .container {
            width: min(900px, calc(100% - 32px));
            margin: 40px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: clamp(28px, 5vw, 42px);
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .header p {
            color: #6b7280;
            font-size: 15px;
        }

        .chat-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .messages {
            height: 500px;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 12px 15px;
            border-radius: 14px;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .user .bubble {
            background: #6366f1;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai .bubble {
            background: #f3f4f6;
            color: #111827;
            border-bottom-left-radius: 4px;
        }

        .welcome {
            text-align: center;
            margin: auto;
            color: #6b7280;
        }

        .welcome-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .welcome h2 {
            color: #111827;
            margin-bottom: 6px;
        }

        .input-area {
            border-top: 1px solid #e5e7eb;
            padding: 16px;
            background: #fafafa;
        }

        .input-form {
            display: flex;
            gap: 10px;
        }

        .input-form textarea {
            flex: 1;
            resize: none;
            min-height: 48px;
            max-height: 140px;
            padding: 13px 15px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            outline: none;
            font-family: inherit;
            font-size: 15px;
            background: white;
        }

        .input-form textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .send-button {
            width: 52px;
            border: none;
            border-radius: 12px;
            background: #6366f1;
            color: white;
            cursor: pointer;
            font-size: 20px;
            transition: 0.2s;
        }

        .send-button:hover {
            background: #4f46e5;
        }

        .send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .hint {
            margin-top: 9px;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }

        .typing {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing span {
            width: 6px;
            height: 6px;
            background: #9ca3af;
            border-radius: 50%;
            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }

        }

        .footer {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #9ca3af;
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 0 16px;
            }

            .container {
                width: calc(100% - 20px);
                margin: 20px auto;
            }

            .messages {
                height: 60vh;
                min-height: 400px;
                padding: 16px;
            }

            .bubble {
                max-width: 88%;
            }

            .input-area {
                padding: 12px;
            }

        }

    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Model<span>OnCloud</span>
        </div>

        <div class="status">
            <div class="status-dot"></div>
            API Online
        </div>

    </nav>


    <main class="container">

        <div class="header">

            <h1>
                Chat with AI
            </h1>

            <p>
                Powered by the ModelOnCloud API
            </p>

        </div>


        <section class="chat-card">

            <div
                class="messages"
                id="messages"
            >

                <div class="welcome" id="welcome">

                    <div class="welcome-icon">
                        🤖
                    </div>

                    <h2>
                        How can I help?
                    </h2>

                    <p>
                        Ask me anything to get started.
                    </p>

                </div>

            </div>


            <div class="input-area">

                <form
                    class="input-form"
                    id="chatForm"
                >

                    <textarea
                        id="messageInput"
                        placeholder="Type your message..."
                        rows="1"
                        autocomplete="off"
                    ></textarea>

                    <button
                        class="send-button"
                        id="sendButton"
                        type="submit"
                        title="Send message"
                    >
                        ↑
                    </button>

                </form>

                <div class="hint">
                    Press Enter to send · Shift + Enter for new line
                </div>

            </div>

        </section>


        <div class="footer">
            ModelOnCloud · Simple AI API
        </div>

    </main>


    <script>

        const API_URL = "/api/chat";

        const chatForm =
            document.getElementById("chatForm");

        const messageInput =
            document.getElementById("messageInput");

        const sendButton =
            document.getElementById("sendButton");

        const messages =
            document.getElementById("messages");

        const welcome =
            document.getElementById("welcome");


        function addMessage(text, type) {

            if (welcome) {
                welcome.remove();
            }

            const message =
                document.createElement("div");

            message.className =
                `message ${type}`;

            const bubble =
                document.createElement("div");

            bubble.className = "bubble";

            bubble.textContent = text;

            message.appendChild(bubble);

            messages.appendChild(message);

            messages.scrollTop =
                messages.scrollHeight;

            return message;

        }


        function addTyping() {

            if (welcome) {
                welcome.remove();
            }

            const message =
                document.createElement("div");

            message.className = "message ai";

            message.id = "typingMessage";

            const bubble =
                document.createElement("div");

            bubble.className = "bubble";

            bubble.innerHTML = `
                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;

            message.appendChild(bubble);

            messages.appendChild(message);

            messages.scrollTop =
                messages.scrollHeight;

        }


        function removeTyping() {

            const typing =
                document.getElementById(
                    "typingMessage"
                );

            if (typing) {
                typing.remove();
            }

        }


        async function askAI(message) {

            const response =
                await fetch(API_URL, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                });


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    `API error: ${response.status}`
                );

            }


            return data.answer;

        }


        chatForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const message =
                    messageInput.value.trim();


                if (!message) {
                    return;
                }


                addMessage(
                    message,
                    "user"
                );


                messageInput.value = "";

                messageInput.style.height =
                    "48px";

                sendButton.disabled = true;

                messageInput.disabled = true;


                addTyping();


                try {

                    const answer =
                        await askAI(message);

                    removeTyping();

                    addMessage(
                        answer ||
                        "The AI returned an empty response.",
                        "ai"
                    );

                } catch (error) {

                    removeTyping();

                    addMessage(
                        `Error: ${error.message}`,
                        "ai"
                    );

                } finally {

                    sendButton.disabled =
                        false;

                    messageInput.disabled =
                        false;

                    messageInput.focus();

                }

            }
        );


        messageInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    chatForm.requestSubmit();

                }

            }
        );


        messageInput.addEventListener(
            "input",
            function () {

                this.style.height =
                    "48px";

                this.style.height =
                    `${Math.min(
                        this.scrollHeight,
                        140
                    )}px`;

            }
        );


    </script>

</body>

</html>
